dataset:
  path: data/raw/loan_data.csv
  target: loan_status
  expected_columns:
    - person_age
    - person_gender
    - person_education
    - person_income
    - person_emp_exp
    - person_home_ownership
    - loan_amnt
    - loan_intent
    - loan_int_rate
    - loan_percent_income
    - cb_person_cred_hist_length
    - credit_score
    - previous_loan_defaults_on_file
    - loan_status

cleaning:
  # Inherited from the previous project; treated as a hypothesis to audit,
  # not an unquestionable truth. Do not silently discard rows.
  max_age_exclusive: 84
  min_employment_age: 18

split:
  strategy: stratified
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  random_state: 42

audit:
  high_cardinality_warning_threshold: 0.95
  target_feature_minimum_group_count: 1
